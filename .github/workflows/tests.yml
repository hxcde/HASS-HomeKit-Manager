name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for the camera/stream components
        run: sudo apt-get update && sudo apt-get install -y libturbojpeg ffmpeg
      - name: Install Home Assistant test harness
        run: |
          pip install pytest-homeassistant-custom-component ruff
          pip install $(python script/core_requirements.py)
      - name: Lint
        run: |
          ruff check custom_components tests script
          ruff format --check custom_components tests script
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Committed bundle is up to date
        run: git diff --exit-code -- ../custom_components/homekit_manager/frontend
